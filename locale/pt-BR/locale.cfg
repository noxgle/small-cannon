[mod-setting-description]
small-cannon-scan-interval=How often (in ticks, 60 = 1 second) each Small Artillery Turret scans for enemy clusters. Lower values react faster but cost more UPS.
small-cannon-cluster-radius=Enemies within this radius (in tiles) of each other count as one cluster.
small-cannon-min-targets=The turret fires at the largest enemy cluster with at least this many enemies. Set to 1 to engage even lone targets.
small-cannon-aim-offset=Calibration offset (in full turns) added to the computed barrel angle. If the barrel persistently points away from the target, try -0.25 or 0.25 (a quarter turn).
