small-cannon-min-targets=Wieża strzela w największą grupę wrogów liczącą co najmniej tylu wrogów. Ustaw 1, aby ostrzeliwać nawet samotne cele.
small-cannon-aim-offset=Korekta (w pełnych obrotach) dodawana do wyliczonego kąta lufy. Jeśli lufa stale wskazuje w bok od celu, spróbuj wartości co szesnastą część obrotu (np. ±0.25 to ćwierć obrotu).
