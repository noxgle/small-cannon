[mod-setting-description]
small-cannon-scan-interval=Co ile ticków (60 = 1 sekunda) Mała Artyleria skanuje w poszukiwaniu grup wrogów. Niższe wartości to szybsza reakcja, ale większe obciążenie (UPS).
